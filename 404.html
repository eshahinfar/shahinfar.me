<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Ehsan Shahinfar</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/styles.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="/" aria-label="Ehsan Shahinfar — home">

        <span class="brand-name">Ehsan Shahinfar</span>

    </div>
  </header>

  <main id="main">
    <section class="hero" style="min-height: 70vh">
      <div class="wrap">
        <p class="eyebrow">Error 404</p>

        <p class="lede">This page doesn't exist or has moved.</p>
        <p class="hero-body" lang="de">Diese Seite existiert nicht oder wurde verschoben.</p>
        <div class="cta">
          <a class="btn primary" href="/">Home</a>
          <a class="btn" href="/#projects">Projects</a>

    <div class="wrap">

</html>
